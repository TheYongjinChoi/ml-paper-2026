<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1940" viewBox="0 0 1400 1940">
<title>상권 내부 특성과 외부 연대성의 연구 프레임워크</title>
<desc>2021~2025년 개별 상권의 자료 구성, 관계 분석과 미래 예측, 양적·질적 결과 종합의 세 층 연구 수행 순서.</desc>
<rect width="1400" height="1940" fill="white"/>
<text x="700" y="30" dominant-baseline="text-before-edge" text-anchor="middle" font-family="Malgun Gothic, 맑은 고딕, sans-serif" font-size="39" font-weight="700" fill="#172C40">상권 내부 특성과 외부 연대성의 연구 프레임워크</text>
<text x="700" y="89" dominant-baseline="text-before-edge" text-anchor="middle" font-family="Malgun Gothic, 맑은 고딕, sans-serif" font-size="24" font-weight="400" fill="#4E6172">개별 상권 · 2021~2025년  |  민감성과 대응력을 구분하여 분석</text>
<rect x="55" y="145" width="1290" height="54" rx="7" fill="#172C40" stroke="#172C40"/>
<text x="78" y="156" dominant-baseline="text-before-edge" text-anchor="start" font-family="Malgun Gothic, 맑은 고딕, sans-serif" font-size="27" font-weight="700" fill="white">LAYER 1   상권 내부 특성과 외부 연대성의 자료 구성</text>
<rect x="55" y="218" width="630" height="310" rx="12" fill="#EDF3F9" stroke="#CCD6DE"/>
<rect x="715" y="218" width="630" height="310" rx="12" fill="#EDF6F3" stroke="#CCD6DE"/>
<text x="82" y="239" dominant-baseline="text-before-edge" text-anchor="start" font-family="Malgun Gothic, 맑은 고딕, sans-serif" font-size="29" font-weight="700" fill="#172C40">상권 내부 특성</text>
<text x="82" y="288" dominant-baseline="text-before-edge" text-anchor="start" font-family="Malgun Gothic, 맑은 고딕, sans-serif" font-size="24" font-weight="700" fill="#172C40">민감성</text>
<text x="82" y="325" dominant-baseline="text-before-edge" text-anchor="start" font-family="Malgun Gothic, 맑은 고딕, sans-serif" font-size="24" font-weight="400" fill="#172C40">대면활동 의존 · 업종구조와 다양성</text>
<text x="82" y="361" dominant-baseline="text-before-edge" text-anchor="start" font-family="Malgun Gothic, 맑은 고딕, sans-serif" font-size="24" font-weight="400" fill="#172C40">고객 구성 · 수요 기반</text>
<text x="82" y="412" dominant-baseline="text-before-edge" text-anchor="start" font-family="Malgun Gothic, 맑은 고딕, sans-serif" font-size="24" font-weight="700" fill="#172C40">대응력</text>
<text x="82" y="449" dominant-baseline="text-before-edge" text-anchor="start" font-family="Malgun Gothic, 맑은 고딕, sans-serif" font-size="24" font-weight="400" fill="#172C40">상인조직의 공동 대응 · 자금 조달 가능성</text>
<text x="82" y="485" dominant-baseline="text-before-edge" text-anchor="start" font-family="Malgun Gothic, 맑은 고딕, sans-serif" font-size="24" font-weight="400" fill="#172C40">기존 채무 등 금융 제약</text>
<text x="742" y="239" dominant-baseline="text-before-edge" text-anchor="start" font-family="Malgun Gothic, 맑은 고딕, sans-serif" font-size="29" font-weight="700" fill="#172C40">외부 연대성</text>
<text x="742" y="288" dominant-baseline="text-before-edge" text-anchor="start" font-family="Malgun Gothic, 맑은 고딕, sans-serif" font-size="24" font-weight="700" fill="#172C40">외부 자원 접근</text>
<text x="742" y="325" dominant-baseline="text-before-edge" text-anchor="start" font-family="Malgun Gothic, 맑은 고딕, sans-serif" font-size="24" font-weight="400" fill="#172C40">자금·정보·서비스 접근</text>
<text x="742" y="361" dominant-baseline="text-before-edge" text-anchor="start" font-family="Malgun Gothic, 맑은 고딕, sans-serif" font-size="24" font-weight="400" fill="#172C40">지원사업 참여·수혜 이력</text>
<text x="742" y="412" dominant-baseline="text-before-edge" text-anchor="start" font-family="Malgun Gothic, 맑은 고딕, sans-serif" font-size="24" font-weight="700" fill="#172C40">공동 논의·협력</text>
<text x="742" y="449" dominant-baseline="text-before-edge" text-anchor="start" font-family="Malgun Gothic, 맑은 고딕, sans-serif" font-size="24" font-weight="400" fill="#172C40">외부 기관과의 협의 참여</text>
<text x="742" y="485" dominant-baseline="text-before-edge" text-anchor="start" font-family="Malgun Gothic, 맑은 고딕, sans-serif" font-size="24" font-weight="400" fill="#172C40">공동사업과 실행 활동</text>
<polyline points="370,528 370,546 1030,546 1030,528" fill="none" stroke="#8193A2" stroke-width="3"/>
<polyline points="700,546 700,570" fill="none" stroke="#8193A2" stroke-width="3"/>
<polygon points="693,558 707,558 700,570" fill="#8193A2"/>
<rect x="220" y="570" width="960" height="74" rx="12" fill="#F5F7F9" stroke="#CCD6DE"/>
<text x="700" y="581" dominant-baseline="text-before-edge" text-anchor="middle" font-family="Malgun Gothic, 맑은 고딕, sans-serif" font-size="25" font-weight="700" fill="#172C40">상권별·시기별 자료 결합</text>
<text x="700" y="614" dominant-baseline="text-before-edge" text-anchor="middle" font-family="Malgun Gothic, 맑은 고딕, sans-serif" font-size="22" font-weight="400" fill="#4E6172">경계·코드·시점 확인  /  내부 조직과 외부 관계 구분</text>
<polyline points="700,644 700,674" fill="none" stroke="#8193A2" stroke-width="3"/>
<polygon points="693,662 707,662 700,674" fill="#8193A2"/>
<rect x="55" y="681" width="1290" height="54" rx="7" fill="#172C40" stroke="#172C40"/>
<text x="78" y="692" dominant-baseline="text-before-edge" text-anchor="start" font-family="Malgun Gothic, 맑은 고딕, sans-serif" font-size="27" font-weight="700" fill="white">LAYER 2   내부 특성 × 외부 연대성의 관계 분석과 미래 예측</text>
<rect x="55" y="753" width="1290" height="84" rx="12" fill="#EDF3F9" stroke="#CCD6DE"/>
<text x="700" y="765" dominant-baseline="text-before-edge" text-anchor="middle" font-family="Malgun Gothic, 맑은 고딕, sans-serif" font-size="27" font-weight="700" fill="#172C40">외부 연대성과 이후 경제적 성과의 관계는</text>
<text x="700" y="800" dominant-baseline="text-before-edge" text-anchor="middle" font-family="Malgun Gothic, 맑은 고딕, sans-serif" font-size="27" font-weight="700" fill="#172C40">상권의 민감성과 대응력에 따라 어떻게 달라지는가?</text>
<rect x="55" y="858" width="630" height="148" rx="12" fill="white" stroke="#CCD6DE"/>
<rect x="715" y="858" width="630" height="148" rx="12" fill="white" stroke="#CCD6DE"/>
<text x="82" y="877" dominant-baseline="text-before-edge" text-anchor="start" font-family="Malgun Gothic, 맑은 고딕, sans-serif" font-size="26" font-weight="700" fill="#172C40">H5a  보완 가설</text>
<text x="82" y="920" dominant-baseline="text-before-edge" text-anchor="start" font-family="Malgun Gothic, 맑은 고딕, sans-serif" font-size="24" font-weight="400" fill="#172C40">민감성이 높거나 대응 자원이 부족할 때</text>
<text x="82" y="956" dominant-baseline="text-before-edge" text-anchor="start" font-family="Malgun Gothic, 맑은 고딕, sans-serif" font-size="24" font-weight="400" fill="#172C40">연대성과 양호한 성과의 관계가 더 뚜렷한가?</text>
<text x="742" y="877" dominant-baseline="text-before-edge" text-anchor="start" font-family="Malgun Gothic, 맑은 고딕, sans-serif" font-size="26" font-weight="700" fill="#172C40">H5b  강화 가설</text>
<text x="742" y="920" dominant-baseline="text-before-edge" text-anchor="start" font-family="Malgun Gothic, 맑은 고딕, sans-serif" font-size="24" font-weight="400" fill="#172C40">내부 역량이 갖추어진 상권에서</text>
<text x="742" y="956" dominant-baseline="text-before-edge" text-anchor="start" font-family="Malgun Gothic, 맑은 고딕, sans-serif" font-size="24" font-weight="400" fill="#172C40">연대성과 양호한 성과의 관계가 더 뚜렷한가?</text>
<rect x="55" y="1030" width="630" height="175" rx="12" fill="#F5F7F9" stroke="#CCD6DE"/>
<rect x="715" y="1030" width="630" height="175" rx="12" fill="#F5F7F9" stroke="#CCD6DE"/>
<text x="82" y="1049" dominant-baseline="text-before-edge" text-anchor="start" font-family="Malgun Gothic, 맑은 고딕, sans-serif" font-size="26" font-weight="700" fill="#172C40">관계 분석  |  패널 회귀</text>
<text x="82" y="1092" dominant-baseline="text-before-edge" text-anchor="start" font-family="Malgun Gothic, 맑은 고딕, sans-serif" font-size="23" font-weight="400" fill="#172C40">H1~H3  업종구조·수요의 기본 관계와 차이</text>
<text x="82" y="1129" dominant-baseline="text-before-edge" text-anchor="start" font-family="Malgun Gothic, 맑은 고딕, sans-serif" font-size="23" font-weight="400" fill="#172C40">H5a·H5b  내부 조건 × 외부 연대성</text>
<text x="82" y="1167" dominant-baseline="text-before-edge" text-anchor="start" font-family="Malgun Gothic, 맑은 고딕, sans-serif" font-size="21" font-weight="400" fill="#4E6172">전체 분석 + 자료 확보 상권의 심화 분석</text>
<text x="742" y="1049" dominant-baseline="text-before-edge" text-anchor="start" font-family="Malgun Gothic, 맑은 고딕, sans-serif" font-size="26" font-weight="700" fill="#172C40">미래 예측  |  회귀·트리 기반 모형</text>
<text x="742" y="1092" dominant-baseline="text-before-edge" text-anchor="start" font-family="Malgun Gothic, 맑은 고딕, sans-serif" font-size="23" font-weight="400" fill="#172C40">H4  업종구조·수요 정보의 추가 예측 가치</text>
<text x="742" y="1129" dominant-baseline="text-before-edge" text-anchor="start" font-family="Malgun Gothic, 맑은 고딕, sans-serif" font-size="23" font-weight="400" fill="#172C40">H6  조직·연대성 정보의 추가 예측 가치</text>
<text x="742" y="1167" dominant-baseline="text-before-edge" text-anchor="start" font-family="Malgun Gothic, 맑은 고딕, sans-serif" font-size="21" font-weight="400" fill="#4E6172">이후 분기 폐업률·명목 매출 변화 / 시간외 평가</text>
<polyline points="370,1205 370,1223 1030,1223 1030,1205" fill="none" stroke="#8193A2" stroke-width="3"/>
<polyline points="700,1223 700,1249" fill="none" stroke="#8193A2" stroke-width="3"/>
<polygon points="693,1237 707,1237 700,1249" fill="#8193A2"/>
<rect x="55" y="1255" width="1290" height="54" rx="7" fill="#172C40" stroke="#172C40"/>
<text x="78" y="1266" dominant-baseline="text-before-edge" text-anchor="start" font-family="Malgun Gothic, 맑은 고딕, sans-serif" font-size="27" font-weight="700" fill="white">LAYER 3   양적·질적 결과의 종합과 리질리언스 해석</text>
<rect x="55" y="1330" width="630" height="156" rx="12" fill="#EDF3F9" stroke="#CCD6DE"/>
<rect x="715" y="1330" width="630" height="156" rx="12" fill="#EDF6F3" stroke="#CCD6DE"/>
<text x="82" y="1349" dominant-baseline="text-before-edge" text-anchor="start" font-family="Malgun Gothic, 맑은 고딕, sans-serif" font-size="26" font-weight="700" fill="#172C40">양적 결과  |  경제활동의 규모와 변화</text>
<text x="82" y="1396" dominant-baseline="text-before-edge" text-anchor="start" font-family="Malgun Gothic, 맑은 고딕, sans-serif" font-size="24" font-weight="400" fill="#172C40">매출·거래 변화</text>
<text x="82" y="1435" dominant-baseline="text-before-edge" text-anchor="start" font-family="Malgun Gothic, 맑은 고딕, sans-serif" font-size="24" font-weight="400" fill="#172C40">점포 수 · 개업·폐업</text>
<text x="742" y="1349" dominant-baseline="text-before-edge" text-anchor="start" font-family="Malgun Gothic, 맑은 고딕, sans-serif" font-size="26" font-weight="700" fill="#172C40">질적 결과  |  업종 구성과 상권 기능</text>
<text x="742" y="1396" dominant-baseline="text-before-edge" text-anchor="start" font-family="Malgun Gothic, 맑은 고딕, sans-serif" font-size="24" font-weight="400" fill="#172C40">업종별 구성비 · 업종의 진입·퇴출과 재편</text>
<text x="742" y="1435" dominant-baseline="text-before-edge" text-anchor="start" font-family="Malgun Gothic, 맑은 고딕, sans-serif" font-size="24" font-weight="400" fill="#172C40">생활·소비 기능의 변화</text>
<polyline points="370,1486 370,1504 1030,1504 1030,1486" fill="none" stroke="#8193A2" stroke-width="3"/>
<polyline points="700,1504 700,1530" fill="none" stroke="#8193A2" stroke-width="3"/>
<polygon points="693,1518 707,1518 700,1530" fill="#8193A2"/>
<rect x="55" y="1530" width="1290" height="113" rx="12" fill="#EDF3F9" stroke="#CCD6DE"/>
<text x="700" y="1548" dominant-baseline="text-before-edge" text-anchor="middle" font-family="Malgun Gothic, 맑은 고딕, sans-serif" font-size="28" font-weight="700" fill="#172C40">지역사회 경제 리질리언스의 종합 해석</text>
<text x="700" y="1596" dominant-baseline="text-before-edge" text-anchor="middle" font-family="Malgun Gothic, 맑은 고딕, sans-serif" font-size="24" font-weight="400" fill="#172C40">유지·개선과 재편의 조합  ·  취약성의 양상  ·  연대성의 보완·강화 조건</text>
<polyline points="700,1643 700,1680" fill="none" stroke="#8193A2" stroke-width="3"/>
<polygon points="693,1668 707,1668 700,1680" fill="#8193A2"/>
<rect x="55" y="1680" width="1290" height="109" rx="12" fill="#EDF6F3" stroke="#CCD6DE"/>
<text x="700" y="1696" dominant-baseline="text-before-edge" text-anchor="middle" font-family="Malgun Gothic, 맑은 고딕, sans-serif" font-size="27" font-weight="700" fill="#172C40">과정 기록을 통한 적응적 거버넌스 탐색</text>
<text x="700" y="1741" dominant-baseline="text-before-edge" text-anchor="middle" font-family="Malgun Gothic, 맑은 고딕, sans-serif" font-size="24" font-weight="400" fill="#172C40">공동 평가·학습 → 지원 방식·공동 대응의 수정 여부 확인</text>
<text x="55" y="1824" dominant-baseline="text-before-edge" text-anchor="start" font-family="Malgun Gothic, 맑은 고딕, sans-serif" font-size="21" font-weight="400" fill="#4E6172">주  화살표는 연구 수행 순서이며 인과경로나 현상의 발생 순서를 뜻하지 않음.</text>
<text x="55" y="1857" dominant-baseline="text-before-edge" text-anchor="start" font-family="Malgun Gothic, 맑은 고딕, sans-serif" font-size="21" font-weight="400" fill="#4E6172">조직·금융·연대성 항목은 자료 확보 범위에서 분석하며, 업종 재편을 곧바로 개선으로 판단하지 않음.</text>
<text x="55" y="1895" dominant-baseline="text-before-edge" text-anchor="start" font-family="Malgun Gothic, 맑은 고딕, sans-serif" font-size="19" font-weight="400" fill="#4E6172">자료: 연구계획서 제2.1~2.6절에 기초한 연구자 작성.</text>
</svg>